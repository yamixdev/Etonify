name: "Feature request (English)"
description: "Suggest a capability or usability improvement for Etonify."
title: "[Feature] "
labels:
  - "enhancement"
body:
  - type: "markdown"
    attributes:
      value: "Describe the task you want to accomplish. Use the bug report form for broken behavior. Do not include subscription URLs, credentials or other secrets."
  - type: "textarea"
    id: "problem"
    attributes:
      label: "What task or capability is missing?"
      description: "Explain what is difficult or impossible to do today."
    validations:
      required: true
  - type: "textarea"
    id: "solution"
    attributes:
      label: "How should it work?"
      description: "Describe the intended behavior. A mockup or example is helpful but not required."
    validations:
      required: true
  - type: "textarea"
    id: "alternatives"
    attributes:
      label: "Alternatives considered"
      description: "Mention existing settings or workarounds, if any."
    validations:
      required: false
  - type: "checkboxes"
    id: "checks"
    attributes:
      label: "Before submitting"
      options:
        - label: "I searched for similar feature requests."
          required: true
        - label: "The request and attachments contain no secrets."
          required: true

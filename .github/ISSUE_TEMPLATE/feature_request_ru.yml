name: "Предложить улучшение (Русский)"
description: "Предложение по возможностям или удобству Etonify."
title: "[Предложение] "
labels:
  - "enhancement"
body:
  - type: "markdown"
    attributes:
      value: "Расскажите, какую задачу вы хотите решить. Для неисправностей используйте форму сообщения об ошибке. Не добавляйте ссылки подписок, учётные данные и другие секреты."
  - type: "textarea"
    id: "problem"
    attributes:
      label: "Какой задачи или возможности не хватает?"
      description: "Опишите, что сейчас неудобно или невозможно сделать."
    validations:
      required: true
  - type: "textarea"
    id: "solution"
    attributes:
      label: "Как это должно работать?"
      description: "Опишите ожидаемое поведение. Макет или пример помогут, но не обязательны."
    validations:
      required: true
  - type: "textarea"
    id: "alternatives"
    attributes:
      label: "Какие варианты вы уже пробовали?"
      description: "Укажите существующие настройки или обходные решения, если они есть."
    validations:
      required: false
  - type: "checkboxes"
    id: "checks"
    attributes:
      label: "Перед отправкой"
      options:
        - label: "Я поискал похожие предложения в issues."
          required: true
        - label: "В тексте и вложениях нет секретных данных."
          required: true

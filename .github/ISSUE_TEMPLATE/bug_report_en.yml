name: "Bug report (English)"
description: "Report an Android connection, subscription, update or interface problem."
title: "[Bug] "
labels:
  - "bug"
body:
  - type: "markdown"
    attributes:
      value: "This report and its attachments are public. Remove subscription URLs, UUIDs, keys, passwords and HWID. Check logs and screenshots before submitting. Report vulnerabilities [privately](https://github.com/yamixdev/Etonify/security/advisories/new)."
  - type: "input"
    id: "version"
    attributes:
      label: "Etonify version"
      description: "Use the version shown in About and include the build number if available."
    validations:
      required: true
  - type: "dropdown"
    id: "channel"
    attributes:
      label: "Release channel or build source"
      options:
        - "Stable"
        - "Beta"
        - "Custom build"
        - "Not sure"
    validations:
      required: true
  - type: "input"
    id: "device"
    attributes:
      label: "Device model"
      placeholder: "For example, Honor X9a"
    validations:
      required: true
  - type: "input"
    id: "android"
    attributes:
      label: "Android and vendor software version"
      placeholder: "For example, Android 13, MagicOS 7.1"
    validations:
      required: true
  - type: "dropdown"
    id: "area"
    attributes:
      label: "Where does the problem occur?"
      options:
        - "VPN start, stop or background operation"
        - "Switching between Wi-Fi and mobile data"
        - "DNS or routing"
        - "Server selection or latency testing"
        - "Adding, importing or refreshing a subscription"
        - "Installing or updating the application"
        - "Interface, performance or memory usage"
        - "Other"
    validations:
      required: true
  - type: "textarea"
    id: "problem"
    attributes:
      label: "What happens?"
      description: "Describe the observed problem. Include the full error message with any secrets removed."
    validations:
      required: true
  - type: "textarea"
    id: "reproduction"
    attributes:
      label: "Steps to reproduce"
      description: "List the actions in order. If it happens intermittently, describe how often."
    validations:
      required: true
  - type: "textarea"
    id: "expected"
    attributes:
      label: "Expected result"
    validations:
      required: true
  - type: "textarea"
    id: "context"
    attributes:
      label: "Conditions and previous versions"
      description: "For network problems, include Wi-Fi/mobile data, protocol, TUN stack and changed DNS settings if known. For regressions, give the last working version and whether this was an upgrade or a fresh install. Reinstalling the app is not required."
    validations:
      required: false
  - type: "textarea"
    id: "diagnostics"
    attributes:
      label: "Logs and screenshots"
      description: "Attach logs covering the problem and relevant screenshots. Remove secrets first. If you cannot provide logs, say so. Private support is available at https://t.me/etonify?direct."
    validations:
      required: false
  - type: "checkboxes"
    id: "checks"
    attributes:
      label: "Before submitting"
      options:
        - label: "I searched for similar open issues."
          required: true
        - label: "I checked the report and attachments and removed secrets."
          required: true

name: "Сообщить об ошибке (Русский)"
description: "Проблемы подключения, подписок, обновлений или интерфейса Android-клиента."
title: "[Ошибка] "
labels:
  - "bug"
body:
  - type: "markdown"
    attributes:
      value: "Отчёт и вложения будут видны всем. Не публикуйте ссылки подписок, UUID, ключи, пароли и HWID. Проверьте логи и скриншоты перед отправкой. Об уязвимостях сообщайте [приватно](https://github.com/yamixdev/Etonify/security/advisories/new)."
  - type: "input"
    id: "version"
    attributes:
      label: "Версия Etonify"
      description: "Укажите версию из раздела «О приложении» и код сборки, если он доступен."
    validations:
      required: true
  - type: "dropdown"
    id: "channel"
    attributes:
      label: "Канал или источник сборки"
      options:
        - "Stable"
        - "Beta"
        - "Собственная сборка"
        - "Не знаю"
    validations:
      required: true
  - type: "input"
    id: "device"
    attributes:
      label: "Модель устройства"
      placeholder: "Например, Honor X9a"
    validations:
      required: true
  - type: "input"
    id: "android"
    attributes:
      label: "Версия Android и оболочки"
      placeholder: "Например, Android 13, MagicOS 7.1"
    validations:
      required: true
  - type: "dropdown"
    id: "area"
    attributes:
      label: "Где возникает проблема?"
      options:
        - "Запуск, остановка или работа VPN в фоне"
        - "Переключение Wi-Fi и мобильной сети"
        - "DNS или маршрутизация"
        - "Выбор сервера или проверка задержки"
        - "Добавление, импорт или обновление подписки"
        - "Установка или обновление приложения"
        - "Интерфейс, производительность или расход памяти"
        - "Другое"
    validations:
      required: true
  - type: "textarea"
    id: "problem"
    attributes:
      label: "Что происходит?"
      description: "Опишите наблюдаемую проблему. Текст ошибки приведите полностью, без секретных данных."
    validations:
      required: true
  - type: "textarea"
    id: "reproduction"
    attributes:
      label: "Как повторить проблему?"
      description: "Перечислите действия по порядку. Если проблема возникает не каждый раз, укажите, как часто."
    validations:
      required: true
  - type: "textarea"
    id: "expected"
    attributes:
      label: "Какого результата вы ожидали?"
    validations:
      required: true
  - type: "textarea"
    id: "context"
    attributes:
      label: "Условия и предыдущие версии"
      description: "Для сетевых проблем: Wi-Fi или мобильная сеть, протокол, стек TUN и изменённые настройки DNS, если известны. Для регрессии: последняя рабочая версия и появилась ли проблема после обновления или на новой установке. Переустанавливать приложение ради отчёта не нужно."
    validations:
      required: false
  - type: "textarea"
    id: "diagnostics"
    attributes:
      label: "Логи и скриншоты"
      description: "Приложите журнал за момент возникновения проблемы и скриншоты, если они помогают её понять. Удалите секретные данные. Если приложить журнал нельзя, укажите это. Для приватного обращения доступен https://t.me/etonify?direct."
    validations:
      required: false
  - type: "checkboxes"
    id: "checks"
    attributes:
      label: "Перед отправкой"
      options:
        - label: "Я поискал похожие открытые issues."
          required: true
        - label: "Я проверил текст и вложения и удалил секретные данные."
          required: true

name: Etonify · Android beta APK (debug signed)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional internal test note (shown only in the workflow run)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"
  JAVA_VERSION: "21"
  MEOW_ALLOW_DEBUG_RELEASE_SIGNING: "true"

jobs:
  build-beta-apk:
    name: Build internal debug-signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify pinned libbox binary
        run: python3 scripts/verify_libbox.py

      - name: Confirm production signing files are absent
        shell: bash
        run: |
          if [ -e android/key.properties ] || [ -e android/app/etonify-release.jks ]; then
            echo "::error title=Unexpected signing file::Internal beta builds must not use a production signing file."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore private Happ crypto assets
        shell: bash
        env:
          HAPP_CRYPTO_ASSETS_PASSPHRASE: ${{ secrets.HAPP_CRYPTO_ASSETS_PASSPHRASE }}
        run: |
          if [ -z "$HAPP_CRYPTO_ASSETS_PASSPHRASE" ]; then
            echo "::error title=Missing secret::HAPP_CRYPTO_ASSETS_PASSPHRASE is not configured in repository secrets"
            exit 1
          fi
          encrypted_assets=".github/private/happ_crypto_assets.zip.gpg"
          if [ ! -s "$encrypted_assets" ]; then
            echo "::error title=Missing encrypted Happ crypto assets::$encrypted_assets is missing or empty"
            exit 1
          fi
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$HAPP_CRYPTO_ASSETS_PASSPHRASE" \
            --output "$tmp_dir/happ_crypto_assets.zip" \
            --decrypt "$encrypted_assets"
          unzip -q "$tmp_dir/happ_crypto_assets.zip" -d "$tmp_dir/unzipped"
          mkdir -p assets/happ_crypto
          if [ -d "$tmp_dir/unzipped/assets/happ_crypto" ]; then
            cp -R "$tmp_dir/unzipped/assets/happ_crypto/." assets/happ_crypto/
          else
            cp -R "$tmp_dir/unzipped/." assets/happ_crypto/
          fi
          for file in selectors.json expanded_rsa_keys.json crypt51_rsa_keys.json native_rsa_keys.json; do
            if [ ! -s "assets/happ_crypto/$file" ]; then
              echo "::error title=Missing Happ crypto asset::assets/happ_crypto/$file is missing or empty"
              exit 1
            fi
          done
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path("pubspec.yaml")
          lines = pubspec.read_text(encoding="utf-8").splitlines()
          entries = [
              "    - assets/happ_crypto/crypt51_rsa_keys.json",
              "    - assets/happ_crypto/expanded_rsa_keys.json",
              "    - assets/happ_crypto/native_rsa_keys.json",
              "    - assets/happ_crypto/selectors.json",
          ]
          if all(entry in lines for entry in entries):
              raise SystemExit(0)
          out = []
          inserted = False
          for line in lines:
              out.append(line)
              if line.strip() == "assets:" and not inserted:
                  out.extend(entries)
                  inserted = True
          if not inserted:
              raise SystemExit("Could not find flutter assets section in pubspec.yaml")
          pubspec.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate Pigeon bindings
        run: dart run pigeon --input pigeons/singbox_api.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        env:
          HAPP_CRYPTO_TESTS: "true"
        run: flutter test

      - name: Build debug-signed ABI APKs
        shell: bash
        run: |
          raw_version="$(awk -F': ' '/^version:/ {print $2; exit}' pubspec.yaml)"
          if [ -z "$raw_version" ]; then
            echo "::error title=Missing version::Could not read version from pubspec.yaml"
            exit 1
          fi
          safe_version="${raw_version//+/_}"
          mkdir -p build/beta-apks
          common_args=(
            --release
            --obfuscate
            --split-debug-info=build/debug-info/android
            --target-platform android-arm,android-arm64
          )
          flutter build apk "${common_args[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/beta-apks/etonify-v${safe_version}-internal-debug-signed-universal.apk"
          flutter build apk "${common_args[@]}" --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "build/beta-apks/etonify-v${safe_version}-internal-debug-signed-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "build/beta-apks/etonify-v${safe_version}-internal-debug-signed-armeabi-v7a.apk"
          cat > build/beta-apks/README.txt <<EOF
          INTERNAL TEST BUILD — NOT FOR DISTRIBUTION

          These APKs use Android's debug signing key, even though they are built
          in release mode. Do not upload them to a GitHub Release or OTA updater.
          They cannot update an installation signed with Etonify's production key.

          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

      - name: Verify debug signing
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "::error title=Missing apksigner::Android build tools did not provide apksigner"
            exit 1
          fi
          for apk in build/beta-apks/*.apk; do
            "$apksigner" verify --verbose --print-certs "$apk"
            "$apksigner" verify --print-certs "$apk" | grep -F "CN=Android Debug"
          done

      - name: Upload internal beta APK artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: etonify-internal-debug-signed-apks-${{ github.run_number }}
          path: build/beta-apks/*
          if-no-files-found: error
          retention-days: 7
